[package]
name = "mediapipe-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["Bruno Gonçalves <www.biglinux.com.br>"]
description = "MediaPipe vision models executed directly in Rust: no ONNX Runtime, OpenVINO or TFLite"
repository = "https://github.com/biglinux/mediapipe-native"
homepage = "https://www.biglinux.com.br"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
