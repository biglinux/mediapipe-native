name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install Rust and the plan exporter
        run: pacman -Syu --noconfirm --needed git rust python-numpy python-onnx python-tensorflow python-flatbuffers

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: tools/export_plans.sh

      - run: tools/verify.sh
